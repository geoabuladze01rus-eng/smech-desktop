name: Смеч — сборки Windows и macOS
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'desktop-v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: Windows-x64
            artifact: Smech-Windows-x64
          - os: macos-15
            label: macOS-AppleSilicon
            artifact: Smech-macOS-arm64
          - os: macos-15-intel
            label: macOS-Intel
            artifact: Smech-macOS-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt -r requirements-dev.txt
      - name: Test application
        run: python -m pytest -q
      - name: Build native application
        run: python scripts/build_native.py
      - name: Smoke-test packaged application — Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Resolve-Path '.\dist\Smech\Smech.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Smoke-test failed (Windows): $($process.ExitCode)" }
      - name: Smoke-test packaged application — macOS
        if: runner.os == 'macOS'
        run: ./dist/Smech.app/Contents/MacOS/Smech --self-test
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force releases | Out-Null
          Compress-Archive -Path 'dist\Smech' -DestinationPath "releases\${{ matrix.artifact }}.zip" -Force
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p releases
          ditto -c -k --sequesterRsrc --keepParent dist/Smech.app "releases/${{ matrix.artifact }}.zip"
          hdiutil create -volname Smech -srcfolder dist/Smech.app -ov -format UDZO "releases/${{ matrix.artifact }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: releases/*
          if-no-files-found: error
          retention-days: 14
